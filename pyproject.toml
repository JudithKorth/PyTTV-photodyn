[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyttv-photodyn"
description = "Photodynamical modeling of transiting exoplanet systems."
readme = "README.md"
authors = [{name = "Judith Korth", email = "judithkorth@gmail.com"}]
license = {text = "GPLv2"}
keywords = ["astronomy", "astrophysics", "exoplanets"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "rebound",
    "reboundx",
    "pandas",
    "xarray",
    "tables",
    "uncertainties",
    "pytransit>=2.9.1",
    "celerite",
    "lightkurve",
]
dynamic = ["version"]

[project.optional-dependencies]
gp = ["george"]

[project.urls]
Homepage = "https://github.com/judithkorth/PyTTV"

[tool.setuptools]
packages = ["pyttv_photodyn", "pyttv_photodyn.io"]
package-dir = {"pyttv_photodyn" = "src"}
include-package-data = true

[tool.setuptools.package-data]
pyttv_photodyn = ["*.h5"]

[tool.setuptools.dynamic]
version = {attr = "pyttv_photodyn.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
